site_name: Gesetze für KI
site_description: Aktuelles Bundes- und Landesrecht für KI-Assistenten. Ein MCP-Server, mit dem Claude, ChatGPT und andere Agenten die Gesetze selbst nachschlagen.
site_url: https://gesetze-fuer-ki.de/
# No repo_url: Material's repository widget asks api.github.com from the visitor's browser, and the privacy page
# promises that the browser talks to no one but this server. The footer links the code instead.
copyright: Copyright &copy; 2026 Marcel Bruckner · <a href="/impressum/">Impressum</a> · <a href="/datenschutz/">Datenschutz</a> · <a href="https://github.com/Gesetze-fuer-KI/gesetze-fuer-ki">Quellcode</a> · <a href="/unterstuetzen/">Unterstützen</a>

# Planning notes are local-only.
exclude_docs: |
  superpowers/

nav:
  - Start: index.md
  - Verbinden: verbinden.md
  - Werkzeuge: werkzeuge.md
  - Daten und Grenzen: daten.md
  - Bundesländer:
      - laender/index.md
      - Baden-Württemberg: laender/baden-wuerttemberg.md
      - Bayern: laender/bayern.md
      - Berlin: laender/berlin.md
      - Brandenburg: laender/brandenburg.md
      - Bremen: laender/bremen.md
      - Hamburg: laender/hamburg.md
      - Hessen: laender/hessen.md
      - Mecklenburg-Vorpommern: laender/mecklenburg-vorpommern.md
      - Niedersachsen: laender/niedersachsen.md
      - Nordrhein-Westfalen: laender/nordrhein-westfalen.md
      - Rheinland-Pfalz: laender/rheinland-pfalz.md
      - Saarland: laender/saarland.md
      - Sachsen: laender/sachsen.md
      - Sachsen-Anhalt: laender/sachsen-anhalt.md
      - Schleswig-Holstein: laender/schleswig-holstein.md
      - Thüringen: laender/thueringen.md
  - Unterstützen: unterstuetzen.md
  - Impressum: impressum.md
  - Datenschutz: datenschutz.md

theme:
  name: material
  language: de
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  logo: assets/logo.svg
  favicon: favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Helles Design
  features:
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: de
  # Downloads fonts and other external assets at build time, so visitors' browsers never contact Google.
  - privacy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
